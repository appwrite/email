<!-- Source for web/public/og.png. Render at 1200×630, for example with @resvg/resvg-js. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowA" cx="0.15" cy="1" r="0.8">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset="1" stop-color="#0a6cff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#57575c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a6cff" flood-opacity="0.35"/>
    </filter>
    <clipPath id="win"><rect x="660" y="120" width="620" height="440" rx="22"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#f5f5f7"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- App icon -->
  <g transform="translate(80 92)" filter="url(#iconShadow)">
    <rect width="88" height="88" rx="21" fill="url(#icon)"/>
    <rect x="16.5" y="26" width="55" height="37" rx="6" fill="#fff"/>
    <path d="M18.5 29.5 L44 48 L69.5 29.5" stroke="#2a8cff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Copy -->
  <g font-family="SF Pro Display, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="80" y="222" width="282" height="36" rx="18" fill="#e8e8ed"/>
    <text x="100" y="246" font-size="17" font-weight="600" fill="#007aff">Open source</text>
    <text x="214" y="246" font-size="17" font-weight="500" fill="#6e6e73">· Self-hostable</text>
    <text x="78" y="336" font-size="74" font-weight="700" letter-spacing="-3" fill="url(#title)">Email you</text>
    <text x="78" y="418" font-size="74" font-weight="700" letter-spacing="-3" fill="url(#title)">actually own.</text>
    <text x="80" y="476" font-size="24" fill="#6e6e73">A beautifully simple inbox, with an API</text>
    <text x="80" y="508" font-size="24" fill="#6e6e73">and MCP server for your AI assistant.</text>
    <text x="80" y="574" font-size="18" font-weight="600" fill="#1d1d1f">Runs on Appwrite Cloud or your own Appwrite</text>
  </g>

  <!-- Product window -->
  <g filter="url(#shadow)">
    <rect x="660" y="120" width="620" height="440" rx="22" fill="#ffffff"/>
  </g>
  <g clip-path="url(#win)" font-family="SF Pro Text, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="660" y="120" width="170" height="440" fill="#f5f5f7"/>
    <circle cx="684" cy="144" r="6.5" fill="#ff5f57"/>
    <circle cx="704" cy="144" r="6.5" fill="#febc2e"/>
    <circle cx="724" cy="144" r="6.5" fill="#28c840"/>
    <text x="680" y="186" font-size="12" font-weight="600" fill="#a1a1a6">Mailboxes</text>
    <rect x="672" y="198" width="146" height="30" rx="8" fill="#e8e8ed"/>
    <text x="686" y="218" font-size="14" fill="#1d1d1f">Inbox</text>
    <text x="800" y="218" font-size="13" fill="#a1a1a6" text-anchor="end">2</text>
    <text x="686" y="252" font-size="14" fill="#1d1d1f">Starred</text>
    <text x="686" y="282" font-size="14" fill="#1d1d1f">Snoozed</text>
    <text x="686" y="312" font-size="14" fill="#1d1d1f">Sent</text>
    <text x="686" y="342" font-size="14" fill="#1d1d1f">Archive</text>

    <text x="852" y="162" font-size="22" font-weight="700" fill="#1d1d1f">Inbox</text>
    <text x="852" y="182" font-size="12" fill="#a1a1a6">2 unread</text>

    <!-- Rows -->
    <g>
      <circle cx="858" cy="215" r="4" fill="#007aff"/>
      <circle cx="886" cy="224" r="17" fill="#ff9f0a"/>
      <text x="886" y="229" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">NS</text>
      <text x="914" y="217" font-size="14" font-weight="700" fill="#1d1d1f">Northwind Studio</text>
      <text x="914" y="236" font-size="13" fill="#1d1d1f">Final cut is ready for review</text>
      <text x="914" y="253" font-size="12" fill="#86868b">Uploaded the 4K master and the stems…</text>
    </g>
    <rect x="844" y="268" width="428" height="72" rx="12" fill="#007aff" fill-opacity="0.1"/>
    <g>
      <circle cx="858" cy="287" r="4" fill="#007aff"/>
      <circle cx="886" cy="296" r="17" fill="#5e5ce6"/>
      <text x="886" y="301" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">AL</text>
      <text x="914" y="289" font-size="14" font-weight="700" fill="#1d1d1f">Ada Lovelace</text>
      <text x="914" y="308" font-size="13" fill="#1d1d1f">Re: Analytical Engine notes</text>
      <text x="914" y="325" font-size="12" fill="#86868b">I have annotated the second section…</text>
    </g>
    <g>
      <circle cx="886" cy="368" r="17" fill="#30b0c7"/>
      <text x="886" y="373" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">GH</text>
      <text x="914" y="361" font-size="14" font-weight="600" fill="#1d1d1f">Grace Hopper</text>
      <text x="914" y="380" font-size="13" fill="#1d1d1f">Found a bug in relay 70</text>
      <text x="914" y="397" font-size="12" fill="#86868b">Panel F. Taped it to the logbook…</text>
    </g>
    <!-- MCP activity -->
    <rect x="852" y="430" width="300" height="104" rx="16" fill="#f5f5f7"/>
    <text x="872" y="458" font-size="12" font-weight="600" fill="#007aff">✦ Assistant via MCP</text>
    <text x="872" y="486" font-size="13" font-family="SF Mono, Menlo, monospace" fill="#1d1d1f">✓ update_messages</text>
    <text x="1134" y="486" font-size="12" fill="#86868b" text-anchor="end">6 archived</text>
    <text x="872" y="512" font-size="13" font-family="SF Mono, Menlo, monospace" fill="#1d1d1f">✓ reply_to_email</text>
    <text x="1134" y="512" font-size="12" fill="#86868b" text-anchor="end">sent</text>
  </g>
</svg>
